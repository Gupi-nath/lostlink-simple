<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Report an item · LostLink</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .post-hero {
      background: linear-gradient(135deg, #07091a 0%, #0d1230 60%, #1a0d2e 100%);
      padding: 36px 0 28px;
      border-bottom: 1px solid var(--line);
      margin-bottom: 32px;
    }
    .post-hero h1 { font-size: 1.9rem; color: #fff; }
    .post-hero p  { color: var(--text-sub); margin-top: 6px; }
    .form-section { margin-bottom: 28px; }
    .form-section-title {
      font-size: .75rem;
      text-transform: uppercase;
      letter-spacing: .1em;
      color: var(--muted);
      font-weight: 700;
      margin-bottom: 14px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--line);
    }
    .btn-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 4px; }
  </style>
</head>
<body>
  <header class="navbar" id="navbar"></header>

  <div class="post-hero">
    <div class="container narrow" style="max-width:640px">
      <h1 id="page-title">📋 Report an Item</h1>
      <p>Fill in the details carefully so others can identify the item.</p>
    </div>
  </div>

  <main style="padding-top:0">
    <div class="container" style="max-width:640px">
      <div id="msg" class="alert hidden"></div>
      <form id="item-form" class="card card-pad">

        <div class="form-section">
          <div class="form-section-title">📌 Item Type</div>
          <div class="field">
            <div class="radio-group">
              <label><input type="radio" name="type" value="lost" checked> 🔍 I lost it</label>
              <label><input type="radio" name="type" value="found"> 📦 I found it</label>
            </div>
          </div>
        </div>

        <div class="form-section">
          <div class="form-section-title">📝 Item Details</div>
          <div class="field">
            <label for="title">Title</label>
            <input id="title" maxlength="100" placeholder="e.g. Black umbrella with wooden handle" required>
          </div>
          <div class="field-row">
            <div class="field">
              <label for="category">Category</label>
              <select id="category" required></select>
            </div>
            <div class="field">
              <label for="event_date">Date <span class="muted" id="date-hint"></span></label>
              <input id="event_date" type="date" required>
            </div>
          </div>
          <div class="field">
            <label for="location">Location</label>
            <input id="location" maxlength="120" placeholder="Building, room or area on campus" required>
          </div>
          <div class="field">
            <label for="description">Description <span class="muted">(optional)</span></label>
            <textarea id="description" rows="3" maxlength="800" placeholder="Colour, brand, distinguishing marks…"></textarea>
          </div>
        </div>

        <div class="form-section" id="verify-box">
          <div class="form-section-title">🔐 Verification</div>
          <div class="field">
            <label for="verify_question">Verification question <span class="muted">(found items only)</span></label>
            <input id="verify_question" maxlength="160" placeholder="Something only the real owner would know">
            <div class="hint">⚠️ Do not write the answer here — only the question.</div>
          </div>
        </div>

        <div class="btn-row">
          <button class="btn" id="submit-btn" type="submit">✅ Post Report</button>
          <a class="btn btn-ghost" href="index.html">Cancel</a>
        </div>
      </form>
    </div>
  </main>

  <footer class="footer"><div class="container">📍 LostLink · Web Application Development Final Lab Project</div></footer>
  <script src="js/common.js"></script>
  <script src="js/post.js"></script>
</body>
</html>
